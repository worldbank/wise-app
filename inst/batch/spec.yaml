# WISE-APP batch grid. Settings left out take the app defaults.
#
# Run `wiseapp::wise_spec_expand("spec.yaml")` to list the runs before
# running anything.

seed: 123                       # the app default

outcome:
  name: welfare
  currency: PPP

# Step 1 model. Leave `model` out to run the descriptive tables only; `{}` fits
# the app's default model (linear, fixed effects year and gaul1_code, no
# covariates) for every run. Add `type` (linear, logistic, rif),
# `fixed_effects` and `covariates` here, or switch them on an axis (see the
# commented profiles below).
model: {}

# Step 2 simulation (needs a model). Leave `sim` out to stop at the model
# tables; `sim: {}` runs the app's defaults: the 1991-2020 historical weather,
# SSP3-7.0 for 2025-2035 and the latest survey wave of each economy. The
# climate projections must be in the data folder.
# sim:
#   hist_years: [1991, 2020]
#   future_periods: [[2025, 2035], [2040, 2050]]   # up to three; [] for historical only
#   ssps: [ssp2_4_5, ssp3_7_0]                     # ssp2_4_5, ssp3_7_0, ssp5_8_5
#   residuals: original                            # original or resample (RIF: none)
#   coef_uncertainty: true
#   baseline_survey: [BFA|2021]                    # CODE|YEAR; default: latest wave

# Step 3 policy (needs a simulation). Levers: sp (cash transfer, regular or
# shock-responsive), infra, digital, labor, education, other. A lever starts from
# the initial values of its controls in the app; a lever left out is not part of
# the run. The setting names are the ids of the controls; for infra, digital,
# education and other they are `<code>_universal` and `<code>_pct`, where
# <code> is the lever code of the variable list (column `policy`), e.g.
# electricity, water, internet, educ_primary. `other` holds levers whose group
# has no module of its own. Earlier stems (elec, imp_wat_san, primary, secondary,
# postsec) are still read. A policy can also be switched on an axis (see the
# commented profiles below).
# policy:
#   sp: {transfer_amount_usd: 60, targeting: exante_poor, targeting_threshold_pct: 30}
#   infra: {electricity_pct: 30}

# Named settings that an axis can switch between. A weather profile lists the
# weather variables (the names of the variable list, at most two).
profiles:
  weather:
    tx_3m:
      tx: {ref_period: [1, 3], form: continuous}
    tx_12m:
      tx: {ref_period: [1, 12], form: continuous}
  # covariates:
  #   basic: {method: user, vars: [hhsize, urban]}
  #   lasso: {method: lasso}          # settings: lasso: {alpha, lambda, nfolds, ...}
  # model:
  #   linear: {type: linear}          # linear, logistic, rif
  #   rif: {type: rif}
  # sim:
  #   ssp3: {ssps: [ssp3_7_0], future_periods: [[2025, 2035]]}
  #   ssp2_5: {ssps: [ssp2_4_5, ssp5_8_5], future_periods: [[2025, 2035]]}
  # policy:                           # a profile is the whole policy; {} is none
  #   none: {}
  #   cash:
  #     sp: {transfer_amount_usd: 60, targeting: exante_poor, targeting_threshold_pct: 30}
  #   shock:
  #     sp: {sp_type: shock, trigger_variable: tx, trigger_type: return_period,
  #          trigger_return_period_years: 10, transfer_amount_usd: 60,
  #          targeting: exante_poor, targeting_threshold_pct: 30}

# Every combination of the axes is one run. Axes that share work (the same
# country or weather variable) reuse it.
axes:
  country: [BFA]
  weather: [tx_3m, tx_12m]
  # covariates: [basic, lasso]
  # model: [linear, rif]
  # sim: [ssp3, ssp2_5]
  # policy: [none, cash, shock]

# exclude:
#   - {country: MWI, weather: tx_12m}
