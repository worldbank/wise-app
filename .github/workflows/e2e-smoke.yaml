# Browser smoke job (CR-OPS-01, CR-A11Y-09): boots the app in headless Chrome
# through shinytest2, checks one conditionalPanel and runs axe-core on the
# Overview, Step 1, Step 2 and Step 3 screens (tests/e2e/smoke.R). Steps 1 to 3
# run on the small fixture data folder the script builds, so no private data is
# needed.
#
# Blocking: a failure fails the job, and `main` requires it as a status check.
# The script fails on serious or critical axe violations (WISEAPP_AXE_FAIL=1).
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

name: e2e-smoke

permissions: read-all

jobs:
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "true"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      WISEAPP_AXE_FAIL: "1"
      # The runner context is not available in job-level env (the workflow
      # would be rejected before any job starts), so the output dir is a
      # path under the workspace instead of runner.temp.
      WISEAPP_E2E_OUT: e2e-out
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::shinytest2 any::jsonlite any::pkgload any::processx any::httpuv
          needs: check

      # The ubuntu-24.04 runner image has no Chrome binary on PATH, so chromote
      # timed out waiting for the debugging port. Install a stable Chrome and
      # pass its path to chromote (CHROMOTE_CHROME).
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Smoke test
        shell: bash
        env:
          CHROMOTE_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: Rscript tests/e2e/smoke.R

      - name: Upload axe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-results
          path: e2e-out
          if-no-files-found: ignore
